# This config contains the default values for training 22.05kHz Low-frame rate Speech Codec model.
# If you want to train model on other dataset, you can change config values according to your dataset.
# Most dataset-specific arguments are in the head of the config file, see below.

name: FocalcodecWithDiscriminants

max_epochs: 200 # 250 initally
# Adjust batch size based on GPU memory
batch_size: 1
workers_num: 4
# When doing weighted sampling with multiple manifests, this defines how many training steps are in an epoch.
# If null, then weighted sampling is disabled.
weighted_sampling_steps_per_epoch: null

log_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/logs

# Dataset metadata for each manifest
# https://github.com/NVIDIA/NeMo/blob/main/nemo/collections/tts/data/vocoder_dataset.py#L39-L41
train_ds_meta:
  manifest_path: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/librispeech_22k_train.json
  sample_weight: 1.0
  audio_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100
  audio_tar_filepaths: []
val_ds_meta:
  manifest_path: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/librispeech_22k_val.json
  sample_weight: 1.0
  audio_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100
  audio_tar_filepaths: []

log_ds_meta:
  manifest_path: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/librispeech_22k_train.json
  sample_weight: 1.0
  audio_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100
  audio_tar_filepaths: []

# Modify these values based on your sample rate
sample_rate: 22050
samples_per_frame: 1920
train_n_samples: 24696 # ~1.11 seconds
# The product of the down_sample_rates and up_sample_rates should match the samples_per_frame.
# For example 8 * 8 * 4 * 2 * 2 = 1024.
up_sample_rates: [8, 8, 4, 2, 2]
down_sample_rates: [2, 2, 4, 8, 8]

encoder_out_dim: 1024

compressor_input_dim: ${encoder_out_dim}
compressor_output_dim: 16

quantizer_dim: ${compressor_output_dim}

decompressor_input_dim: ${compressor_output_dim}
decompressor_output_dim: ${encoder_out_dim}

decoder_input_dim: ${encoder_out_dim}

model:
  max_epochs: ${max_epochs}
  steps_per_epoch: 1000
  weighted_sampling_steps_per_epoch: 1000

  sample_rate: ${sample_rate}
  samples_per_frame: ${samples_per_frame}

  mel_loss_l1_scale: 1.0
  mel_loss_l2_scale: 0.0
  stft_loss_scale: 20.0
  time_domain_loss_scale: 0.0
  codebook_loss_scale: 0.0
  commit_loss_scale: 0.0

  compressor_output_dim: ${compressor_output_dim}
  encoder_out_dim: ${encoder_out_dim}

  use_compressor: false

  # Probability of updating the discriminator during each training step
  # For example, update the discriminator 1/2 times (1 update for every 2 batches)
  disc_updates_per_period: 1
  disc_update_period: 2

  # All resolutions for mel reconstruction loss, ordered [num_fft, hop_length, window_length]
  loss_resolutions:
    [
      [32, 8, 32],
      [64, 16, 64],
      [128, 32, 128],
      [256, 64, 256],
      [512, 128, 512],
      [1024, 256, 1024],
      [2048, 512, 2048],
    ]
  mel_loss_dims: [5, 10, 20, 40, 80, 160, 320]
  mel_loss_log_guard: 1.0
  stft_loss_log_guard: 1.0
  feature_loss_type: absolute

  debug: false
  compressor_on: true

  train_ds:
    dataset:
      _target_: nemo.collections.tts.data.vocoder_dataset.VocoderDataset
      dataset_meta:
        librispeech:
          manifest_path: ${train_ds_meta.manifest_path}
          audio_dir: ${train_ds_meta.audio_dir}
          sample_weight: ${train_ds_meta.sample_weight}
          audio_tar_filepaths: ${train_ds_meta.audio_tar_filepaths}
      weighted_sampling_steps_per_epoch: null
      sample_rate: ${sample_rate}
      n_samples: ${train_n_samples}
      min_duration: 0.4 # seconds
      max_duration: null

    dataloader_params:
      batch_size: ${batch_size}
      drop_last: true
      num_workers: ${workers_num}

  validation_ds:
    dataset:
      _target_: nemo.collections.tts.data.vocoder_dataset.VocoderDataset
      sample_rate: ${sample_rate}
      n_samples: null
      min_duration: null
      max_duration: null
      trunc_duration: 10.0 # Only use the first 10 seconds of audio for computing validation loss
      dataset_meta:
        # - _target_: nemo.collections.tts.data.vocoder_dataset.DatasetMeta   # include to be extra explicit
        librispeech:
          manifest_path: ${val_ds_meta.manifest_path}
          audio_dir: ${val_ds_meta.audio_dir}
          sample_weight: ${val_ds_meta.sample_weight}
          audio_tar_filepaths: ${val_ds_meta.audio_tar_filepaths}

    dataloader_params:
      batch_size: ${batch_size}
      num_workers: ${workers_num}

  # Configures how audio samples are generated and saved during training.
  # Remove this section to disable logging.
  log_config:
    log_dir: ${log_dir}
    log_epochs: [1, 3, 5]
    epoch_frequency: 3
    log_tensorboard: false
    log_wandb: true

    generators:
      - _target_: nemo.collections.tts.parts.utils.callbacks.AudioCodecArtifactGenerator
        log_audio: true
        log_encoding: false
        log_dequantized: false

    dataset:
      _target_: nemo.collections.tts.data.vocoder_dataset.VocoderDataset
      sample_rate: ${sample_rate}
      n_samples: null
      min_duration: null
      max_duration: null
      trunc_duration: 10.0 # Only log the first 10 seconds of generated audio.
      dataset_meta:
        librispeech:
          manifest_path: ${val_ds_meta.manifest_path}
          audio_dir: ${val_ds_meta.audio_dir}
          sample_weight: ${val_ds_meta.sample_weight}
          audio_tar_filepaths: ${val_ds_meta.audio_tar_filepaths}

    dataloader_params:
      batch_size: ${batch_size}
      num_workers: ${workers_num}

  audio_encoder:
    _target_: nemo.collections.tts.modules.wavlm.WavLM
    dim: ${encoder_out_dim}

  audio_decoder:
    _target_: nemo.collections.tts.modules.vocos.Vocos
    input_dim: ${decoder_input_dim}
    dim: ${decoder_input_dim}

  compressor:
    _target_: nemo.collections.tts.modules.focalnet.FocalEncoder
    input_dim: ${compressor_input_dim}
    output_dim: ${compressor_output_dim}

  decompressor:
    _target_: nemo.collections.tts.modules.focalnet.FocalDecoder
    input_dim: ${decompressor_input_dim}
    output_dim: ${decompressor_output_dim}

  vector_quantizer:
    _target_: nemo.collections.tts.modules.focalnet.BinarySphericalQuantizer
    dim: ${quantizer_dim}

  # discriminator:
  #   _target_: nemo.collections.tts.modules.audio_codec_modules.Discriminator
  #   discriminators:
  #     # Multi-Period Discriminator (MPD):
  #     # Analyzes the signal at different periodic intervals to capture pitch/harmonics
  #     - _target_: nemo.collections.tts.modules.hifigan_modules.MultiPeriodDiscriminator

  #     # Multi-Scale Discriminator (MSD):
  #     # Analyzes the signal at different resolutions (original, 2x downsampled, 4x downsampled)
  #     - _target_: nemo.collections.tts.modules.hifigan_modules.MultiScaleDiscriminator

  discriminator:
    _target_: nemo.collections.tts.modules.audio_codec_modules.Discriminator
    discriminators:
      - _target_: nemo.collections.tts.modules.audio_codec_modules.MultiPeriodDiscriminator
      - _target_: nemo.collections.tts.modules.audio_codec_modules.MultiResolutionDiscriminatorSTFT
        resolutions: [[512, 128, 512], [1024, 256, 1024]]
        stft_bands:
          [[0.0, 0.1], [0.1, 0.25], [0.25, 0.5], [0.5, 0.75], [0.75, 1.0]]

  generator_loss:
    _target_: nemo.collections.tts.losses.audio_codec_loss.GeneratorSquaredLoss

  discriminator_loss:
    _target_: nemo.collections.tts.losses.audio_codec_loss.DiscriminatorSquaredLoss

  optim:
    _target_: torch.optim.Adam
    lr: 2e-4
    betas: [0.8, 0.99]

    sched:
      name: ExponentialLR
      gamma: 0.998

trainer:
  num_nodes: 1
  devices: -1
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  precision: 32
  max_epochs: ${max_epochs}
  accumulate_grad_batches: 1
  enable_checkpointing: False # Provided by exp_manager
  logger: false # Provided by exp_manager
  log_every_n_steps: 1000
  check_val_every_n_epoch: 1
  benchmark: false

exp_manager:
  exp_dir: /mnt/matylda6/xdobos00/NeMo/exp
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  create_wandb_logger: true
  wandb_logger_kwargs:
    mode: offline
    name: ${name}
    project: focalcodec-v4
    save_dir: /homes/eva/xd/xdobos00/.wandb_osh_command_dir
  checkpoint_callback_params:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_best_model: true
    always_save_nemo: true
  resume_if_exists: false
  resume_ignore_no_checkpoint: false
