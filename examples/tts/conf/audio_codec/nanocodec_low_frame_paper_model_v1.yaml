# This config contains the default values for training 22.05kHz Low-frame rate Speech Codec model.
# If you want to train model on other dataset, you can change config values according to your dataset.
# Most dataset-specific arguments are in the head of the config file, see below.

name: NanoCodec100hWithoutMetrics

# Adjust batch size based on GPU memory
# When doing weighted sampling with multiple manifests, this defines how many training steps are in an epoch.
# If null, then weighted sampling is disabled.
# weighted_sampling_steps_per_epoch: null

log_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/logs

# Dataset metadata for each manifest
# https://github.com/NVIDIA/NeMo/blob/main/nemo/collections/tts/data/vocoder_dataset.py#L39-L41
train_ds_meta:
  manifest_path: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/librispeech_22k_train.json
  sample_weight: 1.0
  audio_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100
  audio_tar_filepaths: []
val_ds_meta:
  manifest_path: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/librispeech_22k_val.json
  sample_weight: 1.0
  audio_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100
  audio_tar_filepaths: []

log_ds_meta:
  manifest_path: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100/librispeech_22k_train.json
  sample_weight: 1.0
  audio_dir: /mnt/matylda6/xdobos00/NeMo-old/scripts/dataset_processing/data-100
  audio_tar_filepaths: []

max_epochs: 196
batch_size: 8
weighted_sampling_steps_per_epoch: 1000

# --- Global Audio Params ---
sample_rate: 22050
samples_per_frame: 1024 # Updated from 1024
# train_n_samples: 24696

# Sampling rates must product to 1764 (7 * 7 * 6 * 3 * 2)
up_sample_rates: [7, 7, 6, 3, 2]
down_sample_rates: [2, 3, 6, 7, 7]

num_codebooks: 4 # Updated from 8
encoder_out_dim: 16 # Updated from 32

model:
  max_epochs: ${max_epochs}
  sample_rate: ${sample_rate}
  samples_per_frame: ${samples_per_frame}

  # --- Loss Scales (Updated to match target) ---
  mel_loss_l1_scale: 10.0
  mel_loss_l2_scale: 0.0
  stft_loss_scale: 10.0
  time_domain_loss_scale: 0.0
  codebook_loss_scale: 0.0
  commit_loss_scale: 0.0

  # New parameters from target config
  use_scl_loss: false
  acl_loss_scale: 0.015
  use_asr_consitency_loss: false
  scl_loss_scale: 0.1

  mel_loss_dims: [5, 10, 20, 40, 80, 160]
  mel_loss_log_guard: 1.0
  stft_loss_log_guard: 1.0
  feature_loss_type: absolute

  # --- Encoder Architecture ---
  audio_encoder:
    _target_: nemo.collections.tts.modules.audio_codec_modules.HiFiGANEncoder
    down_sample_rates: ${down_sample_rates}
    encoded_dim: ${encoder_out_dim}
    base_channels: 24 # Reduced from 48
    activation: "lrelu"
    pad_mode: "replicate"

  # --- Decoder Architecture (Changed to Causal) ---
  audio_decoder:
    _target_: nemo.collections.tts.modules.audio_codec_modules.CausalHiFiGANDecoder
    up_sample_rates: ${up_sample_rates}
    input_dim: ${encoder_out_dim}
    base_channels: 864 # Reduced from 1024
    activation: "half_snake" # Changed from lrelu
    output_activation: "clamp" # Changed from tanh
    pad_mode: "zeros"
    n_groups_equal_to_out_channels: true

  # --- Quantizer ---
  vector_quantizer:
    _target_: nemo.collections.tts.modules.audio_codec_modules.GroupFiniteScalarQuantizer
    num_groups: ${num_codebooks}
    num_levels_per_group: [9, 8, 8, 7]

  # --- Discriminator (Added SLM Discriminator) ---
  discriminator:
    _target_: nemo.collections.tts.modules.audio_codec_modules.Discriminator
    discriminators:
      - _target_: nemo.collections.tts.modules.audio_codec_modules.MultiPeriodDiscriminator
      - _target_: nemo.collections.tts.modules.audio_codec_modules.MultiResolutionDiscriminatorSTFT
        resolutions:
          - [512, 128, 512]
          - [1024, 256, 1024]
        stft_bands:
          [[0.0, 0.1], [0.1, 0.25], [0.25, 0.5], [0.5, 0.75], [0.75, 1.0]]
      # - _target_: nemo.collections.tts.modules.audio_codec_modules.SLMDiscriminator
      #   slm_model_name: microsoft/wavlm-base-plus
      #   slm_sr: 16000
      #   input_sr: 22050
      #   slm_hidden: 768
      #   slm_layers: 13
      #   initial_channel: 64
      #   use_spectral_norm: false

  optim:
    _target_: torch.optim.Adam
    lr: 2e-4
    betas: [0.8, 0.99]

    sched:
      name: ExponentialLR
      gamma: 0.998

trainer:
  num_nodes: 1
  devices: -1
  accelerator: gpu
  strategy: ddp_find_unused_parameters_true
  precision: 32
  max_epochs: ${max_epochs}
  accumulate_grad_batches: 1
  enable_checkpointing: False # Provided by exp_manager
  logger: false # Provided by exp_manager
  log_every_n_steps: 100
  check_val_every_n_epoch: 1
  benchmark: false

exp_manager:
  exp_dir: /mnt/matylda6/xdobos00/NeMo/exp
  name: ${name}
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  create_wandb_logger: true
  wandb_logger_kwargs:
    mode: offline
    name: ${name}
    project: no-wo-metrics-100h-trainings
    save_dir: /homes/eva/xd/xdobos00/.wandb_osh_command_dir
  checkpoint_callback_params:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_best_model: true
    always_save_nemo: true
  resume_if_exists: true
  resume_ignore_no_checkpoint: true
